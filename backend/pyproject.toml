[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jansetu-backend"
version = "0.1.0"
description = "JANSETU API (FastAPI + PostgreSQL 16)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.120",            # Depends(..., scope="function")
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyjwt>=2.8",
    "argon2-cffi>=23.1",
    "python-dotenv>=1.0",        # scripts/ and db/seed/ read deploy/.env with it
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",               # FastAPI TestClient
]

[tool.setuptools]
packages = ["app", "app.routers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
