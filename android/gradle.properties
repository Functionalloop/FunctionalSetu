org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Server address per build type. A real phone on the office Wi-Fi needs the laptop's LAN address:
# put jansetu.debugApiUrl=http://192.168.x.y:8000/api/v1/ in local.properties (git-ignored).
jansetu.debugApiUrl=http://10.0.2.2:8000/api/v1/
# The live server (6.7). The release build always talks to it; it cannot be changed on the phone.
jansetu.releaseApiUrl=https://myjansetu.com/api/v1/
