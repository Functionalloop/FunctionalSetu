# Local development: PostgreSQL 16 only.
#   docker compose -f deploy/docker-compose.dev.yml up -d
# Reads deploy/.env (copy from deploy/.env.example).
name: jansetu-dev

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-jansetu}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "127.0.0.1:${PGPORT:-5442}:5432"   # local machine only
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-jansetu}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
